[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-jump-gradient-replication"
version = "0.1.0"
description = "Simulation study accompanying Volk-Makarewicz, Borovkova and Heidergott (2022)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["ruff>=0.16"]

[project.scripts]
replicate-paper = "replication.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/replication/plotting.py" = ["E402"]
"scripts/06_debug_mrjd_parameterization.py" = ["E402"]
"scripts/07_resolve_specification.py" = ["E402"]
